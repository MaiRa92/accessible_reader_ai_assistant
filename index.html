<!DOCTYPE html>
<!--
  Universal Access Reader & AI Tutor
  Created by Maria I. Tranou · © 2026
  Designed with Universal Design for Learning (UDL), W3C COGA and WCAG 2.2.
-->
<html lang="el" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Maria I. Tranou">
<meta name="description" content="Universal Access Reader – accessible reading, translation and AI tutoring, designed with UDL, COGA and WCAG 2.2. Created by Maria I. Tranou.">
<meta name="theme-color" content="#FFFFFF">
<title>Universal Access Reader & AI Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* =========================================================
   Design tokens — set at runtime by applySettings()
   Every colour pair is contrast-checked (WCAG 2.2) in JS.
   ========================================================= */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F1F4F8;
  --text:#1B1F24; --muted:#4B5563; --border:#D9DEE5; --border-strong:#6B7280;
  --accent:#1D4ED8; --accent-fill:#1D4ED8; --on-accent:#FFFFFF; --accent-soft:#E8EEFC;
  --focus:#1D4ED8; --danger:#B91C1C; --success:#15803D;
  --read-text:var(--text); --read-bg:var(--surface); --read-surface-2:#F1F4F8;
  --read-muted:#4B5563; --read-accent:#1D4ED8; --read-on-accent:#FFFFFF;
  --read-accent-soft:#E8EEFC; --read-border:#9AA3AF;
  --b0:#0072B2; --b1:#D55E00; --b2:#00805C; --b3:#B4407F; --b4:#9A6700; --b5:#2A7AB0;
  --font-ui:"Noto Sans","Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Open Sans",sans-serif;
  --fs:1; --lh:1.7; --ls:0em; --ws:0em; --measure:70ch;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
}
[data-mode="dark"]{--shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.25)}
[data-mode="hc"]{--shadow:none}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:1rem;line-height:1.55;transition:background-color .2s,color .2s;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4,h5{margin:0;line-height:1.3}
p{margin:0 0 .9em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html[data-reduce-motion] *,html[data-reduce-motion] *::before,html[data-reduce-motion] *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

.skip-link{position:absolute;inset-inline-start:12px;top:-80px;z-index:200;background:var(--accent-fill);color:var(--on-accent);padding:12px 18px;border-radius:10px;font-weight:700;text-decoration:none}
.skip-link:focus{top:12px}

/* ---------- Header ---------- */
.app-header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
[data-mode="hc"] .app-header{border-bottom:2px solid var(--text)}
@media (max-width:760px){.app-header{position:static}}
.header-inner{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--accent-fill);color:var(--on-accent);font-size:1.4rem}
.brand h1{font-size:1.2rem;font-weight:700}
.brand-sub{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lang-pick{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--border-strong);border-radius:12px;padding-inline-start:12px;background:var(--surface);min-height:44px}
.lang-pick i{color:var(--accent)}
.lang-pick label{font-weight:600;font-size:.9rem;white-space:nowrap}
.lang-pick select{border:0;min-height:40px;width:auto;padding:0 8px;background:transparent;font-weight:600;cursor:pointer}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;padding:3px;gap:3px}
.seg-btn{min-height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--text);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.seg-btn:hover{background:var(--surface)}
.seg-btn[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}

/* ---------- Layout ---------- */
.layout{max-width:1320px;width:100%;margin:0 auto;padding:24px 20px 40px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr);flex:1}
@media (min-width:1080px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);align-items:start}}
.col-main,.col-side{display:flex;flex-direction:column;gap:24px;min-width:0}
main:focus{outline:none}

/* ---------- Footer ---------- */
.app-footer{background:var(--surface);border-top:1px solid var(--border);margin-top:auto}
[data-mode="hc"] .app-footer{border-top:2px solid var(--text)}
.footer-inner{max-width:1320px;margin:0 auto;padding:18px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;justify-content:space-between}
.footer-inner p{margin:0}
.creator{display:flex;align-items:center;gap:10px;font-size:.95rem}
.creator i{color:var(--accent)}
.footer-meta{color:var(--muted);font-size:.88rem}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
@media (min-width:640px){.card{padding:24px}}
[data-mode="hc"] .card{border:2px solid var(--text)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px}
.step{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.95rem;border:2px solid var(--accent)}
.card-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:1rem}
[data-mode="hc"] .card-icon,[data-mode="hc"] .step{border:2px solid var(--text)}
.card-desc{margin:-4px 0 14px;color:var(--muted);font-size:.95rem}
.head-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:2px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--accent-fill);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent-fill)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-sm{min-height:40px;padding:0 12px;font-size:.9rem}
.btn-lg{min-height:50px;padding:0 22px;font-size:1rem}
.btn-block{width:100%}
.btn-icon{width:44px;padding:0}
[data-mode="hc"] .btn{border-color:var(--text)}
[data-mode="hc"] .btn-primary:hover:not(:disabled){box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--text)}

/* ---------- Form controls ---------- */
.label{display:block;font-weight:600;margin-bottom:6px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.field{margin-bottom:14px}
textarea,select,input[type="text"],input[type="password"]{width:100%;background:var(--surface);color:var(--text);border:2px solid var(--border-strong);border-radius:10px;padding:10px 12px;min-height:44px}
textarea:hover,select:hover,input[type="text"]:hover,input[type="password"]:hover{border-color:var(--accent)}
textarea.reading-input{font-family:var(--font-read);line-height:1.65;resize:vertical;min-height:160px;color:var(--read-text);background:var(--read-bg)}
input[type="range"]{width:100%;accent-color:var(--accent-fill);min-height:30px;cursor:pointer}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent-fill);width:20px;height:20px}
input[type="color"]{width:52px;height:44px;padding:2px;border:2px solid var(--border-strong);border-radius:10px;background:var(--surface);cursor:pointer}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.convert-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.convert-group .label{margin:0}
.convert-group select{width:auto;max-width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.two{grid-template-columns:1fr}}
.range-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-bottom:14px}
.range-row input[type="range"]{grid-column:1/-1}
.range-row output{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
fieldset:disabled{opacity:.5}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{margin-top:2px;flex:none}
.check small{display:block;color:var(--muted);font-size:.86rem}
.inline-row{display:flex;gap:8px}
.inline-row input{flex:1}

.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:2px solid var(--border-strong);border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;background:var(--surface)}
.choice input:checked+span{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill)}
.choice input:checked+span::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900}
.choice input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- Reader ---------- */
.reader-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.size-ctl{display:inline-flex;align-items:center;border:2px solid var(--border-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.size-ctl button{min-height:40px;min-width:44px;border:0;background:transparent;color:var(--text);font-weight:700;cursor:pointer}
.size-ctl button:hover{background:var(--surface-2)}
.size-ctl output{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-inline:1px solid var(--border);line-height:40px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:thin}
[data-mode="hc"] .tabs{border-bottom-color:var(--text)}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;border-radius:10px 10px 0 0}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft);font-weight:700}
[data-mode="hc"] .tab[aria-selected="true"]{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.tab .count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--surface);color:var(--text);font-size:.8rem;border:1px solid var(--border-strong)}
.tab .count:empty{display:none}

.reading{position:relative;background:var(--read-bg);color:var(--read-text);font-family:var(--font-read);font-size:calc(1.125rem * var(--fs));line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);border:1px solid var(--read-border);border-top:0;border-radius:0 0 14px 14px;padding:26px 22px;min-height:440px}
@media (max-width:600px){.reading{padding:20px 14px}}
.reading :is(p,li,h3,h4,.callout,.lead){max-width:var(--measure)}
.tabpanel:focus-visible{outline-offset:8px}
.doc-title{font-size:1.5em;margin:0 0 .6em;color:var(--read-text)}
.sec-title{font-size:1.1em;margin:1.7em 0 .75em;display:flex;align-items:center;gap:.55em;color:var(--read-accent)}
.tabpanel>.sec-title:first-child,.tabpanel>section:first-child>.sec-title:first-child{margin-top:0}
.lead{color:var(--read-muted);margin:-.4em 0 1em}

.callout{display:flex;gap:14px;background:var(--read-accent-soft);border:2px solid var(--read-accent);border-inline-start-width:7px;border-radius:12px;padding:14px 18px;margin:0 0 1.2em}
.callout-icon{color:var(--read-accent);font-size:1.25em;padding-top:.1em}
.callout-label{font-weight:700;margin:0 0 .15em}
.callout p:last-child{margin:0}

.keypoints{list-style:none;padding:0;margin:0;display:grid;gap:.6em}
.keypoints li{display:flex;gap:.75em;align-items:flex-start;padding:.65em .9em;border-radius:10px;background:var(--read-surface-2);border-inline-start:4px solid var(--read-accent)}
.kp-icon{color:var(--read-accent);flex:none;margin-top:.12em}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.concept{border:1px solid var(--read-border);border-top:6px solid var(--read-accent);border-radius:12px;padding:14px 16px;background:var(--read-bg)}
.concept h5{font-size:1.02em;margin:.45em 0 .3em}
.concept p{margin:0;font-size:.95em}
.concept-num{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--read-accent);color:var(--read-on-accent);font-weight:700;font-size:.85em}

/* Tables */
.table-block{margin-bottom:2em}
.table-caption-text{color:var(--read-muted);margin:-.35em 0 .75em;font-size:.95em}
.table-wrap{overflow-x:auto;border:1px solid var(--read-border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.95em}
th,td{padding:.75em 1em;text-align:start;vertical-align:top;border-bottom:1px solid var(--read-border)}
thead th{background:var(--read-accent-soft);color:var(--read-text);font-weight:700;border-bottom:3px solid var(--read-accent)}
tbody tr:nth-child(even){background:var(--read-surface-2)}
tbody th{font-weight:700}
tbody tr:last-child>*{border-bottom:0}
@media (max-width:600px){
  .stackable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .stackable,.stackable tbody,.stackable tr,.stackable th,.stackable td{display:block;width:100%}
  .stackable tr{border-bottom:2px solid var(--read-border);padding:.5em 0}
  .stackable th,.stackable td{border:0;padding:.3em 1em}
  .stackable td::before,.stackable tbody th::before{content:attr(data-label);display:block;font-weight:700;font-size:.82em;color:var(--read-muted)}
}

/* Mind map */
.mindmap{display:flex;flex-direction:column;align-items:center;margin-bottom:2.2em}
.mm-center{background:var(--read-accent);color:var(--read-on-accent);padding:.75em 1.5em;border-radius:999px;font-weight:700;font-size:1.15em;text-align:center;max-width:min(100%,34ch)}
.mm-stem{width:3px;height:1.4em;background:var(--read-border)}
.mm-branches{list-style:none;margin:0;padding:1.4em 0 0;width:100%;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:1em;border-top:3px solid var(--read-border)}
.mm-branch{position:relative;overflow-wrap:break-word;min-width:0;border:2px solid var(--branch);border-top-width:7px;border-radius:14px;padding:.85em 1em;background:var(--read-bg);max-width:none!important}
.mm-branch::before{content:"";position:absolute;top:calc(-1.4em - 10px);inset-inline-start:50%;width:3px;height:1.4em;background:var(--read-border);transform:translateX(-50%)}
.mm-branch-head{display:flex;align-items:center;gap:.6em;margin-bottom:.45em}
.mm-num{display:inline-grid;place-items:center;flex:none;width:1.9em;height:1.9em;border-radius:50%;border:3px solid var(--branch);font-weight:700;font-size:.85em}
.mm-branch ul{margin:0;padding-inline-start:1.2em}
.mm-branch li{margin:.2em 0}
.mindmap.tree{align-items:stretch}
.tree .mm-center{align-self:flex-start}
.tree .mm-stem{margin-inline-start:1.4em}
.tree .mm-branches{grid-template-columns:1fr;border-top:0;border-inline-start:3px solid var(--read-border);padding:.6em 0 0;padding-inline-start:1.2em;margin-inline-start:1.4em;width:auto}
.tree .mm-branch::before{top:1.1em;inset-inline-start:calc(-1.2em - 2px);width:1.2em;height:3px;transform:none}
@media (max-width:600px){
  .mindmap{align-items:stretch}
  .mm-center{align-self:flex-start}
  .mm-stem{margin-inline-start:1.4em}
  .mm-branches{grid-template-columns:1fr;border-top:0;border-inline-start:3px solid var(--read-border);padding:.6em 0 0;padding-inline-start:1.2em;margin-inline-start:1.4em;width:auto}
  .mm-branch::before{top:1.1em;inset-inline-start:calc(-1.2em - 2px);width:1.2em;height:3px;transform:none}
}

/* Flow */
.flow{list-style:none;padding:0;margin:0;display:grid;gap:2.3em}
.flow-step{position:relative;display:flex;gap:1em;align-items:flex-start;border:2px solid var(--read-border);border-radius:14px;padding:1em 1.1em;background:var(--read-bg);max-width:var(--measure)}
.flow-num{flex:none;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--read-accent);color:var(--read-on-accent)}
.flow-step strong{display:block}
.flow-step p{margin:.15em 0 0}
.flow-arrow{position:absolute;inset-inline-start:1.75em;bottom:-2em;color:var(--read-accent);font-size:1.2em}

/* Translation */
.tr-controls{font-family:var(--font-ui);font-size:1rem;line-height:1.5;letter-spacing:normal;word-spacing:normal;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:1.4em}
[data-mode="hc"] .tr-controls{border:2px solid var(--text)}
.tr-controls .hint{margin-bottom:12px}
.tr-langs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:12px}
@media (max-width:520px){.tr-langs{grid-template-columns:1fr}.tr-langs .btn-icon{justify-self:center;transform:rotate(90deg)}}
.tr-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tr-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 1em;font-family:var(--font-ui);font-size:.88rem;letter-spacing:normal;word-spacing:normal}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--read-surface-2);border:1px solid var(--read-border);color:var(--read-text);font-weight:600}
.pill i{color:var(--read-accent)}
.tr-text{border-inline-start:4px solid var(--read-accent);padding-inline-start:1em}
.tr-result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.2em;font-family:var(--font-ui);font-size:1rem;letter-spacing:normal;word-spacing:normal;line-height:1.4}

/* Empty & loading */
.empty{text-align:center;padding:52px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-icon{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--read-accent-soft);color:var(--read-accent);font-size:1.7rem;border:2px solid var(--read-accent)}
.empty-title{font-weight:700;font-size:1.1em;margin:0}
.empty-text{margin:0 auto;color:var(--read-muted);max-width:46ch}
.loader{display:grid;gap:14px}
.loader-text{display:flex;gap:12px;align-items:center;color:var(--read-muted);font-weight:600;margin:0 0 8px}
.spin{width:24px;height:24px;border:3px solid var(--read-border);border-top-color:var(--read-accent);border-radius:50%;animation:spin 1s linear infinite;flex:none}
.sk{height:1.05em;border-radius:8px;background:linear-gradient(90deg,var(--read-surface-2) 25%,var(--read-accent-soft) 50%,var(--read-surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- TTS ---------- */
.player{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.player .btn{flex:1 1 auto}
.tts-status{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px;margin:12px 0 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.tts-status[data-state="playing"] .dot{background:var(--success)}
.tts-status[data-state="paused"] .dot{background:var(--accent)}

/* ---------- Chat ---------- */
.chat-log{display:flex;flex-direction:column;gap:12px;height:360px;overflow-y:auto;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
[data-mode="hc"] .chat-log{border:2px solid var(--text)}
.msg{display:flex;gap:10px;max-width:94%;align-items:flex-start}
.msg-user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.9rem;border:1px solid var(--border-strong)}
.msg-user .msg-avatar{background:var(--surface);color:var(--text)}
.msg-content{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg-body{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);line-height:1.6;overflow-wrap:anywhere}
.msg-user .msg-body{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill);border-start-end-radius:4px}
.msg-ai .msg-body{border-start-start-radius:4px}
[data-mode="hc"] .msg-body{border:2px solid var(--text)}
[data-mode="hc"] .msg-ai .msg-body{border-style:dashed}
.msg-body p{margin:0 0 .5em}.msg-body p:last-child{margin:0}
.msg-body ul,.msg-body ol{margin:.2em 0 .5em;padding-inline-start:1.25em}
.msg-body.error{border-color:var(--danger);border-width:2px}
.msg-tools button{min-height:32px;padding:0 8px;font-size:.82rem}
.typing{display:inline-flex;gap:5px;align-items:center;height:1.2em}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:.88rem;cursor:pointer}
.chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1}

/* ---------- Details (video) ---------- */
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-radius:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{font-size:1.15rem;display:flex;align-items:center;gap:10px}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(180deg)}
.details-body{margin-top:14px}

/* ---------- Dialog ---------- */
dialog{border:0;padding:0;border-radius:18px;width:min(780px,calc(100vw - 24px));max-height:min(92vh,940px);background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.4)}
[data-mode="hc"] dialog{border:3px solid var(--text)}
dialog::backdrop{background:rgba(8,10,14,.6)}
.dlg{display:flex;flex-direction:column;max-height:min(92vh,940px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.dlg-head h2{font-size:1.2rem;display:flex;align-items:center;gap:10px}
.dlg-body{overflow-y:auto;padding:4px 22px 22px}
.dlg-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
[data-mode="hc"] .dlg-head,[data-mode="hc"] .dlg-foot{border-color:var(--text)}
.set-sec{padding:20px 0;border-bottom:1px solid var(--border)}
.set-sec:last-child{border-bottom:0}
.set-sec h3{font-size:1.02rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.set-sec h3 i{color:var(--accent)}
.set-sec>.hint{margin-bottom:12px}
.option-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt-card{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border:2px solid var(--border-strong);border-radius:12px;cursor:pointer;background:var(--surface);font-weight:600;font-size:.92rem;height:100%}
.opt-card:hover{border-color:var(--accent)}
.opt input:checked+.opt-card{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.opt input:checked+.opt-card::after{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;margin-inline-start:auto;color:var(--accent)}
.opt input:focus-visible+.opt-card{outline:3px solid var(--focus);outline-offset:2px}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.preset-btn{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border:2px solid var(--border-strong);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;text-align:start}
.preset-btn:hover{border-color:var(--accent)}
.color-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.color-row label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.sample{padding:16px 18px;border-radius:12px;border:2px solid var(--border-strong);font-family:var(--font-read);font-size:1.1rem;line-height:1.6}
.sample p{margin:0}
.meter-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.ratio{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:2px solid currentColor;white-space:nowrap}
.badge.pass{color:var(--success)}
.badge.fail{color:var(--danger)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem;margin:10px 0 0}
.note i{color:var(--accent);margin-top:3px}
.note.bad i{color:var(--danger)}
.ext-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;margin:0 0 12px}
.audit{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.audit li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surface-2)}
.audit .pair{display:inline-grid;place-items:center;width:46px;height:32px;border-radius:7px;font-weight:700;font-size:.9rem;border:1px solid var(--border-strong)}
.audit .meta small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.std-links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.9rem}
.std-links a{color:var(--accent);font-weight:600}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:10px;z-index:300;width:min(560px,calc(100vw - 24px))}
.toast{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:12px;background:var(--text);color:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:500}
.toast span{flex:1}
.toast-error{border-inline-start:7px solid var(--danger)}
.toast button{background:transparent;border:0;color:inherit;min-width:40px;min-height:40px;cursor:pointer;border-radius:8px;font-weight:700}
.toast .toast-action{border:2px solid currentColor;padding:0 12px}
.toast :focus-visible{outline-color:currentColor}

#ruler{position:fixed;left:0;right:0;pointer-events:none;background:color-mix(in srgb,var(--read-accent) 14%,transparent);border-top:2px solid var(--read-accent);border-bottom:2px solid var(--read-accent);z-index:25;display:none}

/* ---------- Print: a clean handout with every view ---------- */
@media print{
  .app-header,.col-side,.tabs,.reader-tools,#input-card,.skip-link,#ruler,.toasts,.tr-controls,.tr-result-actions{display:none!important}
  body{background:#fff;color:#000}
  .layout{display:block;padding:0}
  .card{border:0;box-shadow:none;padding:0}
  .reading{border:0;padding:0;min-height:0}
  .tabpanel[hidden]{display:block!important}
  .tabpanel{margin-bottom:24px}
  .app-footer{border-top:1px solid #000}
}
</style>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip"></a>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="fa-solid fa-universal-access"></i></span>
      <div>
        <h1 translate="no">Universal Access Reader</h1>
        <p class="brand-sub" data-i18n="appSub"></p>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-pick">
        <i class="fa-solid fa-globe" aria-hidden="true"></i>
        <label for="lang-select" data-i18n="myLang"></label>
        <select id="lang-select" class="lang-select"></select>
      </div>
      <div class="segmented" role="group" data-i18n-attr="aria-label:modeGroup">
        <button type="button" class="seg-btn" data-mode-btn="light" aria-pressed="true"><i class="fa-solid fa-sun" aria-hidden="true"></i><span data-i18n="light"></span></button>
        <button type="button" class="seg-btn" data-mode-btn="dark" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i><span data-i18n="dark"></span></button>
        <button type="button" class="seg-btn" data-mode-btn="hc" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i><span data-i18n="hc"></span></button>
      </div>
      <button type="button" class="btn btn-secondary" data-open-settings aria-haspopup="dialog"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span data-i18n="openSettings"></span></button>
    </div>
  </div>
</header>

<main id="main" class="layout" tabindex="-1">
  <div class="col-main">

    <!-- Step 1: Input -->
    <section class="card" id="input-card" aria-labelledby="input-h">
      <div class="card-head">
        <h2 id="input-h"><span class="step" aria-hidden="true">1</span> <span data-i18n="step1"></span></h2>
        <div class="head-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="sample-btn"><i class="fa-solid fa-flask" aria-hidden="true"></i><span data-i18n="sample"></span></button>
          <button type="button" class="btn btn-ghost btn-sm" id="clear-btn"><i class="fa-solid fa-eraser" aria-hidden="true"></i><span data-i18n="clear"></span></button>
        </div>
      </div>
      <label for="source-text" class="label" data-i18n="srcLabel"></label>
      <p class="hint" id="source-hint" data-i18n="srcHint"></p>
      <textarea id="source-text" class="reading-input" rows="7" dir="auto" aria-describedby="source-hint char-count" data-i18n-attr="placeholder:srcPh"></textarea>
      <div class="row-between">
        <span id="char-count" class="hint" style="margin:0"></span>
        <div class="convert-group">
          <label for="out-mode" class="label" data-i18n="outLang"></label>
          <select id="out-mode"></select>
          <button type="button" class="btn btn-primary btn-lg" id="format-btn"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span id="format-label" data-i18n="convert"></span></button>
        </div>
      </div>
    </section>

    <!-- Step 2: Reader -->
    <section class="card" id="reader-card" aria-labelledby="reader-h">
      <div class="card-head">
        <h2 id="reader-h"><span class="step" aria-hidden="true">2</span> <span data-i18n="step2"></span></h2>
        <div class="reader-tools">
          <div class="size-ctl" role="group" data-i18n-attr="aria-label:sizeGroup">
            <button type="button" id="size-down" data-i18n-attr="aria-label:smaller"><i class="fa-solid fa-minus" aria-hidden="true"></i> A</button>
            <output id="size-quick" aria-live="polite">100%</output>
            <button type="button" id="size-up" data-i18n-attr="aria-label:larger"><i class="fa-solid fa-plus" aria-hidden="true"></i> A</button>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" data-open-settings aria-haspopup="dialog"><i class="fa-solid fa-font" aria-hidden="true"></i><span data-i18n="settings"></span></button>
          <button type="button" class="btn btn-secondary btn-sm" id="print-btn"><i class="fa-solid fa-print" aria-hidden="true"></i><span data-i18n="print"></span></button>
        </div>
      </div>

      <div class="tabs" role="tablist" data-i18n-attr="aria-label:tabsLabel">
        <button type="button" role="tab" class="tab" id="tab-summary" aria-controls="panel-summary" aria-selected="true"><i class="fa-solid fa-list-check" aria-hidden="true"></i><span data-i18n="tabSummary"></span></button>
        <button type="button" role="tab" class="tab" id="tab-tables" aria-controls="panel-tables" aria-selected="false" tabindex="-1"><i class="fa-solid fa-table" aria-hidden="true"></i><span data-i18n="tabTables"></span> <span class="count" id="count-tables"></span></button>
        <button type="button" role="tab" class="tab" id="tab-diagram" aria-controls="panel-diagram" aria-selected="false" tabindex="-1"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i><span data-i18n="tabDiagram"></span></button>
        <button type="button" role="tab" class="tab" id="tab-translate" aria-controls="panel-translate" aria-selected="false" tabindex="-1"><i class="fa-solid fa-language" aria-hidden="true"></i><span data-i18n="tabTranslate"></span></button>
        <button type="button" role="tab" class="tab" id="tab-source" aria-controls="panel-source" aria-selected="false" tabindex="-1"><i class="fa-solid fa-file-lines" aria-hidden="true"></i><span data-i18n="tabSource"></span></button>
      </div>

      <div id="reading-area" class="reading" aria-busy="false">
        <div id="panel-summary" class="tabpanel" role="tabpanel" aria-labelledby="tab-summary" tabindex="0"></div>
        <div id="panel-tables" class="tabpanel" role="tabpanel" aria-labelledby="tab-tables" tabindex="0" hidden></div>
        <div id="panel-diagram" class="tabpanel" role="tabpanel" aria-labelledby="tab-diagram" tabindex="0" hidden></div>
        <div id="panel-translate" class="tabpanel" role="tabpanel" aria-labelledby="tab-translate" tabindex="0" hidden>
          <div class="tr-controls">
            <p class="hint" data-i18n="trDesc"></p>
            <div class="tr-langs">
              <div><label for="tr-from" class="label" data-i18n="trFrom"></label><select id="tr-from"></select></div>
              <button type="button" class="btn btn-secondary btn-icon" id="tr-swap" data-i18n-attr="aria-label:trSwap;title:trSwap"><i class="fa-solid fa-right-left" aria-hidden="true"></i></button>
              <div><label for="tr-to" class="label" data-i18n="trTo"></label><select id="tr-to"></select></div>
            </div>
            <fieldset>
              <legend class="label" data-i18n="trWhat"></legend>
              <div class="radio-row">
                <label class="choice"><input type="radio" name="tr-src" value="source" checked><span data-i18n="tabSource"></span></label>
                <label class="choice"><input type="radio" name="tr-src" value="summary"><span data-i18n="ttsSummary"></span></label>
              </div>
            </fieldset>
            <div class="tr-actions">
              <button type="button" class="btn btn-primary" id="tr-btn"><i class="fa-solid fa-language" aria-hidden="true"></i><span id="tr-btn-label" data-i18n="trBtn"></span></button>
              <button type="button" class="btn btn-secondary" id="tr-open"><i class="fa-brands fa-google" aria-hidden="true"></i><span data-i18n="trOpen"></span> <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button>
            </div>
          </div>
          <div id="tr-result" aria-live="polite"></div>
        </div>
        <div id="panel-source" class="tabpanel" role="tabpanel" aria-labelledby="tab-source" tabindex="0" hidden></div>
        <div id="loader" class="loader" hidden>
          <p class="loader-text"><span class="spin" aria-hidden="true"></span><span id="loader-msg" data-i18n="loading"></span></p>
          <div class="sk" style="width:55%"></div><div class="sk" style="width:92%"></div><div class="sk" style="width:84%"></div>
          <div class="sk" style="width:88%"></div><div class="sk" style="width:60%"></div>
        </div>
      </div>
    </section>
  </div>

  <aside class="col-side" data-i18n-attr="aria-label:toolsLabel">

    <!-- TTS -->
    <section class="card" aria-labelledby="tts-h">
      <div class="card-head"><h2 id="tts-h"><span class="card-icon" aria-hidden="true"><i class="fa-solid fa-volume-high"></i></span> <span data-i18n="ttsTitle"></span></h2></div>
      <fieldset class="field">
        <legend class="label" data-i18n="ttsWhat"></legend>
        <div class="radio-row">
          <label class="choice"><input type="radio" name="tts-src" value="summary" checked><span data-i18n="ttsSummary"></span></label>
          <label class="choice"><input type="radio" name="tts-src" value="source"><span data-i18n="tabSource"></span></label>
          <label class="choice"><input type="radio" name="tts-src" value="translation"><span data-i18n="tabTranslate"></span></label>
        </div>
      </fieldset>
      <div class="two field">
        <div>
          <label for="tts-language" class="label" data-i18n="ttsLang"></label>
          <select id="tts-language"></select>
        </div>
        <div>
          <label for="tts-voice" class="label" data-i18n="ttsVoice"></label>
          <select id="tts-voice"></select>
        </div>
      </div>
      <div class="range-row">
        <label for="tts-rate" class="label" style="margin:0" data-i18n="ttsRate"></label>
        <output id="tts-rate-out" for="tts-rate">0.9×</output>
        <input type="range" id="tts-rate" min="0.6" max="1.4" step="0.05" value="0.9">
      </div>
      <div class="player" role="group" data-i18n-attr="aria-label:ttsGroup">
        <button type="button" class="btn btn-primary" id="tts-play"><i class="fa-solid fa-play" aria-hidden="true"></i><span id="tts-play-label"></span></button>
        <button type="button" class="btn btn-secondary" id="tts-pause" disabled><i class="fa-solid fa-pause" aria-hidden="true"></i><span data-i18n="pause"></span></button>
        <button type="button" class="btn btn-secondary" id="tts-stop" disabled><i class="fa-solid fa-stop" aria-hidden="true"></i><span data-i18n="stop"></span></button>
      </div>
      <p class="tts-status" id="tts-status" data-state="idle" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="tts-status-text"></span></p>
    </section>

    <!-- Tutor -->
    <section class="card" aria-labelledby="chat-h">
      <div class="card-head"><h2 id="chat-h"><span class="card-icon" aria-hidden="true"><i class="fa-solid fa-comments"></i></span> <span data-i18n="chatTitle"></span></h2></div>
      <p class="card-desc" data-i18n="chatDesc"></p>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite" data-i18n-attr="aria-label:chatLog"></div>
      <div class="chips" role="group" data-i18n-attr="aria-label:chips">
        <button type="button" class="chip" data-q="c1q" data-i18n="c1"></button>
        <button type="button" class="chip" data-q="c2q" data-i18n="c2"></button>
        <button type="button" class="chip" data-q="c3q" data-i18n="c3"></button>
        <button type="button" class="chip" data-q="c4q" data-i18n="c4"></button>
      </div>
      <form id="chat-form" class="chat-form" novalidate>
        <label for="chat-input" class="sr-only" data-i18n="chatInput"></label>
        <input type="text" id="chat-input" dir="auto" autocomplete="off" data-i18n-attr="placeholder:chatPh">
        <button type="submit" class="btn btn-primary btn-icon" data-i18n-attr="aria-label:send"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
      </form>
    </section>

    <!-- Video -->
    <details class="card" id="video-card">
      <summary>
        <h2><span class="card-icon" aria-hidden="true"><i class="fa-solid fa-clapperboard"></i></span> <span data-i18n="videoTitle"></span></h2>
        <i class="fa-solid fa-chevron-down chev" aria-hidden="true"></i>
      </summary>
      <div class="details-body">
        <p class="card-desc" style="margin-top:0" data-i18n="videoDesc"></p>
        <div id="video-init">
          <label for="video-tool" class="label" data-i18n="videoTool"></label>
          <select id="video-tool" class="field"></select>
          <button type="button" class="btn btn-primary btn-block" id="video-btn"><i class="fa-solid fa-film" aria-hidden="true"></i><span id="video-btn-label" data-i18n="videoGen"></span></button>
        </div>
        <div id="video-result" hidden>
          <label for="video-text" class="label" data-i18n="videoScript"></label>
          <textarea id="video-text" rows="10" dir="auto" readonly></textarea>
          <div class="row-between">
            <button type="button" class="btn btn-ghost btn-sm" id="video-new"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span data-i18n="videoNew"></span></button>
            <button type="button" class="btn btn-secondary btn-sm" id="video-copy"><i class="fa-solid fa-copy" aria-hidden="true"></i><span data-i18n="copy"></span></button>
          </div>
        </div>
      </div>
    </details>
  </aside>
</main>

<footer class="app-footer">
  <div class="footer-inner">
    <p class="creator"><i class="fa-solid fa-feather-pointed" aria-hidden="true"></i><span><span data-i18n="createdBy"></span> <strong translate="no">Maria I. Tranou</strong></span></p>
    <p class="footer-meta" translate="no">Universal Access Reader © 2026 · UDL · COGA · WCAG 2.2</p>
  </div>
</footer>

<!-- ================= Settings dialog ================= -->
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="dlg">
    <div class="dlg-head">
      <h2 id="settings-title"><i class="fa-solid fa-sliders" aria-hidden="true"></i> <span data-i18n="openSettings"></span></h2>

  trKeyHint:['Leave it empty to use the Gemini key. If the Cloud Translation API is not enabled for the key, Gemini translates instead.','Αφήστε το κενό για να χρησιμοποιηθεί το κλειδί Gemini. Αν το Cloud Translation API δεν είναι ενεργό για το κλειδί, τη μετάφραση την κάνει το Gemini.','Déjalo vacío para usar la clave de Gemini. Si la API Cloud Translation no está activada para la clave, Gemini traduce en su lugar.','Lascialo vuoto per usare la chiave Gemini. Se l’API Cloud Translation non è attiva per la chiave, traduce Gemini.','Leer lassen, um den Gemini-Schlüssel zu verwenden. Ist die Cloud Translation API für den Schlüssel nicht aktiviert, übersetzt Gemini.','Laissez vide pour utiliser la clé Gemini. Si l’API Cloud Translation n’est pas activée pour la clé, Gemini traduit à la place.'],

  trNo:['Google Cloud Translation is not enabled for this key, so Gemini will translate. To use Google Translate, enable the “Cloud Translation API” for the key’s project in Google Cloud Console.','Το Google Cloud Translation δεν είναι ενεργό για αυτό το κλειδί, οπότε τη μετάφραση θα την κάνει το Gemini. Για να χρησιμοποιηθεί το Google Translate, ενεργοποιήστε το «Cloud Translation API» στο έργο του κλειδιού, στο Google Cloud Console.','Google Cloud Translation no está activado para esta clave, así que traducirá Gemini. Para usar Google Translate, activa la «Cloud Translation API» en el proyecto de la clave en Google Cloud Console.','Google Cloud Translation non è attivo per questa chiave, quindi tradurrà Gemini. Per usare Google Traduttore, attiva la «Cloud Translation API» nel progetto della chiave in Google Cloud Console.','Google Cloud Translation ist für diesen Schlüssel nicht aktiviert, daher übersetzt Gemini. Um Google Übersetzer zu nutzen, aktivieren Sie die „Cloud Translation API“ im Projekt des Schlüssels in der Google Cloud Console.','Google Cloud Translation n’est pas activé pour cette clé ; Gemini traduira donc. Pour utiliser Google Traduction, activez la « Cloud Translation API » dans le projet de la clé sur Google Cloud Console.'],

  eEmpty:['The AI returned an empty answer. Try again or use a shorter text.','Η AI επέστρεψε κενή απάντηση. Δοκιμάστε ξανά ή με μικρότερο κείμενο.','La IA devolvió una respuesta vacía. Inténtalo de nuevo o con un texto más corto.','L’IA ha restituito una risposta vuota. Riprova o usa un testo più breve.','Die KI gab eine leere Antwort. Erneut versuchen oder kürzeren Text verwenden.','L’IA a renvoyé une réponse vide. Réessayez ou utilisez un texte plus court.'],
  eNoKey:['The Gemini API key is missing. It works automatically only inside Gemini Canvas; elsewhere, add your own key in Settings → AI connection.','Λείπει το κλειδί Gemini API. Λειτουργεί αυτόματα μόνο μέσα στο Gemini Canvas· αλλού, προσθέστε το δικό σας κλειδί στις Ρυθμίσεις → Σύνδεση AI.','Falta la clave de la API de Gemini. Solo funciona automáticamente en Gemini Canvas; en otro lugar, añade tu clave en Ajustes → Conexión IA.','Manca la chiave API Gemini. Funziona automaticamente solo in Gemini Canvas; altrove, aggiungi la tua chiave in Impostazioni → Connessione IA.','Der Gemini-API-Schlüssel fehlt. Er funktioniert nur in Gemini Canvas automatisch; fügen Sie sonst Ihren Schlüssel unter Einstellungen → KI-Verbindung hinzu.','La clé API Gemini manque. Elle ne fonctionne automatiquement que dans Gemini Canvas ; ailleurs, ajoutez votre clé dans Réglages → Connexion IA.'],
  eNetwork:['Could not connect to Google. Check your internet. If the file opens inside a preview, open it directly in your browser.','Δεν έγινε σύνδεση με την Google. Ελέγξτε το διαδίκτυο. Αν το αρχείο ανοίγει μέσα σε προεπισκόπηση, ανοίξτε το απευθείας στον browser σας.','No se pudo conectar con Google. Comprueba internet. Si el archivo se abre en una vista previa, ábrelo directamente en el navegador.','Impossibile connettersi a Google. Controlla internet. Se il file si apre in un’anteprima, aprilo direttamente nel browser.','Keine Verbindung zu Google. Prüfen Sie das Internet. Öffnet sich die Datei in einer Vorschau, öffnen Sie sie direkt im Browser.','Connexion à Google impossible. Vérifiez internet. Si le fichier s’ouvre dans un aperçu, ouvrez-le directement dans le navigateur.'],
  eBadKey:['The API key is not valid. Check it in Settings → AI connection.','Το κλειδί API δεν είναι έγκυρο. Ελέγξτε το στις Ρυθμίσεις → Σύνδεση AI.','La clave de API no es válida. Revísala en Ajustes → Conexión IA.','La chiave API non è valida. Controllala in Impostazioni → Connessione IA.','Der API-Schlüssel ist ungültig. Prüfen Sie ihn unter Einstellungen → KI-Verbindung.','La clé API n’est pas valide. Vérifiez-la dans Réglages → Connexion IA.'],
  eRegion:['Gemini is not available for the country or account of this key.','Η υπηρεσία Gemini δεν είναι διαθέσιμη για τη χώρα ή τον λογαριασμό αυτού του κλειδιού.','Gemini no está disponible para el país o la cuenta de esta clave.','Gemini non è disponibile per il paese o l’account di questa chiave.','Gemini ist für das Land oder Konto dieses Schlüssels nicht verfügbar.','Gemini n’est pas disponible pour le pays ou le compte de cette clé.'],

   ========================================================= */
const TABS = ['summary', 'tables', 'diagram', 'translate', 'source'];
let activeTab = 'summary';
let busy = false;
function selectTab(id, focus = false) {
  activeTab = id;
  TABS.forEach(tb => {
    const on = tb === id;
    const b = $('#tab-' + tb);
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    $('#panel-' + tb).hidden = !on || busy;
  });
  if (focus) $('#tab-' + id).focus();
}
function bindTabs() {
  TABS.forEach(tb => $('#tab-' + tb).addEventListener('click', () => selectTab(tb)));
  $('.tabs').addEventListener('keydown', e => {
    const i = TABS.indexOf(activeTab);
    let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % TABS.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = TABS.length - 1;
    if (n !== null) { e.preventDefault(); selectTab(TABS[n], true); }
  });
}

/* =========================================================
   Gemini API (with automatic model fallback)
   ========================================================= */
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
const getUserKey = () => store.get(KEY_STORE);
const getTrKey = () => store.get(TR_KEY_STORE);

function modelOrder() {
  return [...new Set([store.get(MODEL_STORE), MODEL, ...MODEL_FALLBACKS].filter(Boolean))];
}
let lastModelUsed = MODEL;

async function callOnce(model, key, payload) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  } catch (netErr) {
    throw Object.assign(new Error('network'), { kind: 'network', noKey: !key });
  }
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch (_) {}
    throw Object.assign(new Error('HTTP ' + res.status + ' ' + detail), { status: res.status, detail, noKey: !key, model });
  }
  const j = await res.json();
  if (j.promptFeedback?.blockReason) throw Object.assign(new Error('blocked'), { kind: 'blocked' });
  const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!txt) throw Object.assign(new Error('empty'), { kind: 'empty', model });
  return txt;
}

/** Tries each model in turn; retries briefly on overload, moves on if a model is busy, out of quota or missing. */
async function callGemini(payload, triesPerModel = 2, onModel) {
  const key = (API_KEY || getUserKey()).trim();
  let lastErr;
  for (const model of modelOrder()) {
    onModel?.(model);
    for (let i = 0; i < triesPerModel; i++) {
      try {
        const txt = await callOnce(model, key, payload);
        lastModelUsed = model;
        store.set(MODEL_STORE, model);
        return txt;
      } catch (e) {
        lastErr = e;
        if ([400, 401, 403].includes(e.status) || e.kind === 'blocked' || e.kind === 'network') throw e;
        if (e.status === 404) break;
        if (i < triesPerModel - 1) await new Promise(r => setTimeout(r, 1200 * (i + 1)));
      }
    }
  }
  throw Object.assign(lastErr || new Error('failed'), { allModels: true });
}

/** Turns an API error into a plain-language explanation of the real cause. */
function explainError(e) {
  const d = (e?.detail || '').toLowerCase();
  const extra = e?.detail ? t('googleMsg', { d: e.detail.slice(0, 160) }) : '';
  if (e?.kind === 'parse') return t('eParse');
  if (e?.kind === 'blocked') return t('eBlocked');
  if (e?.kind === 'empty') return t('eEmpty');
  if (e?.noKey && (e?.status === 400 || e?.status === 401 || e?.status === 403 || e?.kind === 'network')) return t('eNoKey');
  if (e?.kind === 'network') return t('eNetwork');
  if (e?.status === 400 && d.includes('api key')) return t('eBadKey');
  if (e?.status === 400 && (d.includes('location') || d.includes('region'))) return t('eRegion');
  if (e?.status === 401 || e?.status === 403) return t('eForbidden');
  if (e?.status === 404) return t('e404') + extra;
  if (e?.status === 429) return t('e429') + extra;
  if (e?.status >= 500) return t('e5xx') + extra;
  return t('eOther', { code: e?.status ? t('code', { n: e.status }) : '' });
}

/* Output-language instruction shared by every AI feature */
function outLangRule(text) {
  return S.outMode === 'mine'
    ? `Write every field in ${englishName(S.lang)} (language code "${S.lang}"), even if the TEXT is in another language — translate while simplifying.`
    : 'Write every field in the same language as the TEXT.';
}

const FORMAT_SCHEMA = {
  type: 'OBJECT',
  properties: {
    title: { type: 'STRING' },
    tldr: { type: 'STRING' },
    bullets: { type: 'ARRAY', items: { type: 'STRING' } },
    keyConcepts: { type: 'ARRAY', items: { type: 'OBJECT', properties: { title: { type: 'STRING' }, content: { type: 'STRING' } }, required: ['title', 'content'] } },
    tables: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      title: { type: 'STRING' }, caption: { type: 'STRING' },
      headers: { type: 'ARRAY', items: { type: 'STRING' } },
      rows: { type: 'ARRAY', items: { type: 'ARRAY', items: { type: 'STRING' } } }
    }, required: ['title', 'headers', 'rows'] } },
    glossary: { type: 'ARRAY', items: { type: 'OBJECT', properties: { term: { type: 'STRING' }, definition: { type: 'STRING' } }, required: ['term', 'definition'] } },
    mindmap: { type: 'OBJECT', properties: {
      center: { type: 'STRING' },
      branches: { type: 'ARRAY', items: { type: 'OBJECT', properties: { label: { type: 'STRING' }, points: { type: 'ARRAY', items: { type: 'STRING' } } }, required: ['label', 'points'] } }
    }, required: ['center', 'branches'] },
    flow: { type: 'OBJECT', properties: {
      title: { type: 'STRING' },
      steps: { type: 'ARRAY', items: { type: 'OBJECT', properties: { label: { type: 'STRING' }, detail: { type: 'STRING' } }, required: ['label', 'detail'] } }
    }, required: ['steps'] }
  },
  required: ['title', 'tldr', 'bullets', 'keyConcepts', 'tables', 'glossary', 'mindmap', 'flow']
};

const formatPrompt = text => `You are an expert in plain language, Universal Design for Learning (UDL) and the W3C Cognitive Accessibility (COGA) guidance.
Restructure the TEXT below so that people with cognitive or learning disabilities, dyslexia, ADHD or low literacy can understand it easily.

LANGUAGE: ${outLangRule(text)}

RULES
- Plain, everyday words. Short sentences (ideally under 15 words). One idea per sentence.
- Active voice. No idioms or metaphors. Explain unavoidable technical terms in the glossary.
- Stay accurate. Do not add facts that are not in the text.

FIELDS
- title: a short, clear title (max 8 words).
- tldr: 1–2 sentences: what the text is about and why it matters.
- bullets: 4–8 key points, each one short sentence.
- keyConcepts: 2–6 cards. title = the concept in 1–4 words; content = 1–2 short sentences.
- tables: 1–3 explanatory tables that make the content clearer (comparison, categories, cause → effect, who/what/when, pros/cons, term → example). 2–4 columns, 2–8 rows. The first column is the row label. Every row has exactly as many cells as there are headers. Short cells (max ~15 words). caption = one sentence saying what the table shows.
- glossary: 0–8 difficult words from the text, each with a simple definition.
- mindmap: center = the main topic (1–4 words); 3–6 branches, each with a short label and 2–4 short points.
- flow: if the text describes a process, sequence, steps or a timeline, give 3–8 ordered steps (label = 1–5 words, detail = 1 short sentence) and a short title. Otherwise return an empty steps array.

TEXT:
"""
${text}
"""`;

function normalize(d, lang) {
  const arr = x => Array.isArray(x) ? x : [];
  const str = x => (x == null ? '' : String(x)).trim();
  return {
    lang,
    title: str(d.title), tldr: str(d.tldr),
    bullets: arr(d.bullets).map(str).filter(Boolean),
    keyConcepts: arr(d.keyConcepts).filter(k => k && str(k.title)).map(k => ({ title: str(k.title), content: str(k.content) })),
    tables: arr(d.tables).filter(tb => tb && arr(tb.headers).length && arr(tb.rows).length).map(tb => {
      const headers = tb.headers.map(str);
      return { title: str(tb.title), caption: str(tb.caption), headers,
        rows: tb.rows.map(r => { const row = arr(r).map(str); while (row.length < headers.length) row.push(''); return row.slice(0, headers.length); }) };
    }),
    glossary: arr(d.glossary).filter(g => g && str(g.term)).map(g => ({ term: str(g.term), definition: str(g.definition) })),
    mindmap: { center: str(d.mindmap?.center) || str(d.title),
      branches: arr(d.mindmap?.branches).filter(b => b && str(b.label)).map(b => ({ label: str(b.label), points: arr(b.points).map(str).filter(Boolean) })) },
    flow: { title: str(d.flow?.title),
      steps: arr(d.flow?.steps).filter(s => s && str(s.label)).map(s => ({ label: str(s.label), detail: str(s.detail) })) }
  };
}

/* =========================================================
   Translation — Google Cloud Translation API, with Gemini as fallback
   ========================================================= */
let lastTranslation = null;
let translating = false;

async function googleTranslate(text, from, to, key) {
  const lines = text.split('\n');
  const idx = lines.map((l, i) => l.trim() ? i : -1).filter(i => i >= 0);
  const out = [...lines];
  let detected = from !== 'auto' ? from : null;
  // Batch to stay within API limits (max 128 segments, ~30k chars per request)
  for (let start = 0; start < idx.length;) {
    let end = start, chars = 0;
    while (end < idx.length && end - start < 100 && chars + lines[idx[end]].length < 25000) { chars += lines[idx[end]].length; end++; }
    if (end === start) end = start + 1;
    const batch = idx.slice(start, end);
    const body = { q: batch.map(i => lines[i]), target: to, format: 'text' };
    if (from !== 'auto') body.source = from;
    let res;
    try {
      res = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${encodeURIComponent(key)}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) { throw Object.assign(new Error('network'), { kind: 'network' }); }
    if (!res.ok) {
      let detail = ''; try { detail = (await res.json()).error?.message || ''; } catch (_) {}
      throw Object.assign(new Error('HTTP ' + res.status), { status: res.status, detail });
    }
    const j = await res.json();
    (j.data?.translations || []).forEach((tr, k) => {
      const ta = document.createElement('textarea'); ta.innerHTML = tr.translatedText; // decode any HTML entities
      out[batch[k]] = ta.value;
      if (!detected && tr.detectedSourceLanguage) detected = tr.detectedSourceLanguage;
    });
    start = end;
  }
  return { text: out.join('\n'), engine: 'google', detected: detected || detectLang(text) };
}

async function geminiTranslate(text, from, to) {
  const prompt = `Translate the TEXT into ${englishName(to)} (language code "${to}").
${from !== 'auto' ? `The source language is ${englishName(from)}.` : 'First detect the source language.'}
Keep the meaning exact. Keep paragraphs and line breaks. Use clear, natural language. Do not add explanations.
Return "detectedLanguage" as an ISO 639-1 code and "translation" as the translated text.

TEXT:
"""
${text}
"""`;
  const raw = await callGemini({
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: {
      type: 'OBJECT', properties: { detectedLanguage: { type: 'STRING' }, translation: { type: 'STRING' } }, required: ['detectedLanguage', 'translation'] } }
  });
  const j = parseJson(raw);
  return { text: String(j.translation || '').trim(), engine: 'gemini', detected: from !== 'auto' ? from : (j.detectedLanguage || detectLang(text)) };
}

async function doTranslate(text, from, to) {
  const key = (getTrKey() || getUserKey() || API_KEY).trim();
  if (key) {
    try { return await googleTranslate(text, from, to, key); }
    catch (e) { console.warn('Google Translate unavailable, using Gemini:', e); }
  }
  return geminiTranslate(text, from, to);
}

/* =========================================================
   Text-to-speech (sentence chunking avoids Chrome's ~15s cut-off)
   ========================================================= */
const synth = window.speechSynthesis;
let voices = [], ttsState = 'idle';
function summaryText() {
  if (!lastData) return '';
  return [lastData.title, lastData.tldr, ...lastData.bullets].filter(Boolean).join('\n');
}
const ttsWhich = () => $('input[name="tts-src"]:checked').value;
function getReadText(which = ttsWhich()) {
  if (which === 'summary') return summaryText() || $('#source-text').value;
  if (which === 'translation') return lastTranslation?.text || '';
  return $('#source-text').value;
}
function knownLang(which = ttsWhich()) {
  if (which === 'summary' && lastData) return lastData.lang;
  if (which === 'translation' && lastTranslation) return lastTranslation.lang;
  return detectLang(getReadText(which));
}
const resolveTtsLang = (override) => S.ttsLang !== 'auto' ? S.ttsLang : (override || knownLang());
const voiceScore = v => (/natural|neural|premium|enhanced|online/i.test(v.name) ? 3 : 0) + (/google|microsoft/i.test(v.name) ? 1 : 0);
const voicesFor = code => voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(code.slice(0, 2).toLowerCase())).sort((a, b) => voiceScore(b) - voiceScore(a));
function populateVoiceSelect() {
  const sel = $('#tts-voice');
  if (!sel) return;
  const list = voicesFor(resolveTtsLang());
  const prev = sel.value;
  sel.replaceChildren();
  if (!list.length) sel.append(el('option', { value: '', text: t('defaultVoice') }));
  list.forEach(v => sel.append(el('option', { value: v.name, text: v.name + (voiceScore(v) >= 3 ? ' ★' : '') })));
  if (list.some(v => v.name === prev)) sel.value = prev;
}
function loadVoices() { if (!synth) return; voices = synth.getVoices(); populateVoiceSelect(); }
function chunkText(text) {
  const sentences = text.split(/\n+/).flatMap(line => line.match(/[^.!?;…。！？؟]+[.!?;…。！？؟]*\s*/g) || []).map(s => s.trim()).filter(Boolean);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if ((cur + ' ' + s).length > 220 && cur) { chunks.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s;
  }
  if (cur) chunks.push(cur);
  return chunks;
}
function setTts(state) {
  ttsState = state;
  $('#tts-status').dataset.state = state;
  $('#tts-status-text').textContent = t({ idle: 'ttsIdle', playing: 'ttsPlaying', paused: 'ttsPaused' }[state]);
  $('#tts-play-label').textContent = t(state === 'paused' ? 'resume' : 'play');
  $('#tts-pause').disabled = state !== 'playing';
  $('#tts-stop').disabled = state === 'idle';
}
function speak(textOverride, langOverride) {
  if (!synth) { toast(t('ttsUnsupported'), 'error'); return; }
  if (!textOverride && ttsState === 'paused') { synth.resume(); setTts('playing'); return; }
  const text = (textOverride || getReadText()).trim();
  if (!text) { toast(t('ttsEmpty'), 'error'); return; }
  synth.cancel();
  const lang = textOverride ? (S.ttsLang !== 'auto' ? S.ttsLang : (langOverride || detectLang(text))) : resolveTtsLang();
  const chosen = voices.find(v => v.name === $('#tts-voice').value);
  const voice = chosen && chosen.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()) ? chosen : voicesFor(lang)[0];
  const rate = parseFloat($('#tts-rate').value);
  const chunks = chunkText(text);
  chunks.forEach((ch, i) => {
    const u = new SpeechSynthesisUtterance(ch);
    u.lang = lang; if (voice) u.voice = voice; u.rate = rate; u.pitch = 1;
    if (i === chunks.length - 1) u.onend = () => setTts('idle');
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') setTts('idle'); };
    synth.speak(u);
  });
  setTts('playing');
}
function bindTts() {
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  $('#tts-play').addEventListener('click', () => speak());
  $('#tts-pause').addEventListener('click', () => { if (ttsState === 'playing') { synth.pause(); setTts('paused'); } });
  $('#tts-stop').addEventListener('click', () => { synth?.cancel(); setTts('idle'); });
  $('#tts-language').addEventListener('change', e => { S.ttsLang = e.target.value; saveSettings(); populateVoiceSelect(); });
  $$('input[name="tts-src"]').forEach(i => i.addEventListener('change', populateVoiceSelect));
  $('#tts-rate').addEventListener('input', e => { $('#tts-rate-out').textContent = parseFloat(e.target.value).toFixed(2).replace(/0$/, '') + '×'; });
}

function mdLite(text) {

  let list = null, listType = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    const ul = line.match(/^[-*•]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const type = ul ? 'ul' : 'ol';
      if (!list || listType !== type) { list = el(type); listType = type; frag.append(list); }
      list.append(el('li', {}, inline((ul || ol)[1])));

      if (line) frag.append(el('p', {}, inline(line.replace(/^#+\s*/, ''))));

  return frag;
}

  const isAi = role === 'ai';
  const body = el('div', { class: 'msg-body' });
  if (i18nKey) body.append(el('span', { 'data-i18n': i18nKey, text: t(i18nKey) }));
  else if (text == null) body.append(el('span', { class: 'typing', 'aria-hidden': 'true' }, el('i'), el('i'), el('i')), el('span', { class: 'sr-only', text: t('typing') }));
  else if (isAi) body.append(mdLite(text));
  else { body.textContent = text; body.dir = 'auto'; }
  const content = el('div', { class: 'msg-content' }, el('span', { class: 'sr-only', text: t(isAi ? 'helper' : 'you') }), body);
  const msg = el('div', { class: 'msg ' + (isAi ? 'msg-ai' : 'msg-user') },
    el('span', { class: 'msg-avatar', 'aria-hidden': 'true' }, icon(isAi ? 'robot' : 'user')), content);
  $('#chat-log').append(msg);
  $('#chat-log').scrollTop = $('#chat-log').scrollHeight;
  return msg;
}
function fillMsg(msg, text, isError = false) {
  const body = $('.msg-body', msg);
  body.replaceChildren(mdLite(text));
  body.classList.toggle('error', isError);
  if (!isError) {
    const lc = detectLang(text, S.lang);
    body.lang = lc; body.dir = dirOf(lc);
    $('.msg-content', msg).append(el('div', { class: 'msg-tools' },
      el('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => speak(text, lc) }, icon('volume-high'), t('ttsTitle'))));
  }
  $('#chat-log').scrollTop = $('#chat-log').scrollHeight;
}
async function sendChat(message) {
  const msg = (message ?? $('#chat-input').value).trim();
  if (!msg) return;
  const ctx = $('#source-text').value.trim();
  if (!ctx) { toast(t('needChatText'), 'error'); $('#source-text').focus(); return; }
  addMsg('user', msg);
  $('#chat-input').value = '';
  const pending = addMsg('ai', null);
  chat.push({ role: 'user', parts: [{ text: msg }] });
  const sys = `You are a patient, friendly study tutor following Universal Design for Learning (UDL) and W3C cognitive accessibility (COGA) guidance.
The learner's language is ${englishName(S.lang)}. Reply in ${englishName(S.lang)}, unless the learner writes the question in a different language — then reply in the language of the question.
- Use plain, everyday words and short sentences (about 15 words max).
- For several items or steps, use a short bullet list starting with "- ".
- Bold at most 2–3 key words with **double asterisks**.
- Give one concrete, everyday example when it helps.
- Keep answers under about 150 words unless the learner asks for more.
- Base answers on the CONTEXT. If the answer is not in it, say so gently, then give a short general explanation.
CONTEXT:
"""${ctx}"""`;
  try {
    const reply = await callGemini({ contents: chat, systemInstruction: { parts: [{ text: sys }] } });
    chat.push({ role: 'model', parts: [{ text: reply }] });
    fillMsg(pending, reply);
  } catch (e) {
    console.error(e);
    chat.pop();
    fillMsg(pending, explainError(e), true);
  }
}
function bindChat() {
  addMsg('ai', null, 'chatWelcome');
  $('#chat-form').addEventListener('submit', e => { e.preventDefault(); sendChat(); });
  $$('.chip').forEach(c => c.addEventListener('click', () => sendChat(t(c.dataset.q))));
}

/* =========================================================
   Video script
   ========================================================= */
async function generateVideo() {
  const text = $('#source-text').value.trim();
  const tool = $('#video-tool').value;
  if (!text) { toast(t('videoNeed'), 'error'); return; }
  const btn = $('#video-btn');
  btn.disabled = true; $('#video-btn-label').textContent = t('videoBusy');
  const spoken = S.outMode === 'mine' ? englishName(S.lang) : 'the same language as the TEXT';
  const prompt = `Act as a professional educational video producer. Create a detailed script and visual prompt based on the TEXT, tailored to the AI video tool: ${tool}.
- Avatar tools (Synthesia, HeyGen): speaker demeanour, the exact spoken script, and short on-screen text.
- Generative tools (OpenAI Sora, Runway): detailed visual scene descriptions, camera movement, subjects, lighting; no spoken text. Write the visual prompts in English.
- Stock tools (InVideo): scene-by-scene descriptions plus a voice-over script.
Follow cognitive accessibility (COGA) guidance: plain language, one idea per scene, short on-screen captions, calm pacing. Target 30–60 seconds.
Write the spoken script, captions and your section headings in ${spoken}.

TEXT:
${text}`;
  try {
    const out = await callGemini({ contents: [{ parts: [{ text: prompt }] }] });
    $('#video-text').value = out;
    $('#video-init').hidden = true; $('#video-result').hidden = false;
    $('#video-text').focus();
    announce(t('videoReady'));
  } catch (e) {
    console.error(e);
    toast(explainError(e), 'error', keyAction(e));
  } finally {
    btn.disabled = false; $('#video-btn-label').textContent = t('videoGen');
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = el('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
function bindVideo() {
  $('#video-btn').addEventListener('click', generateVideo);
  $('#video-copy').addEventListener('click', async () => toast(t(await copyText($('#video-text').value) ? 'copied' : 'copyFail'), 'info'));
  $('#video-new').addEventListener('click', () => { $('#video-result').hidden = true; $('#video-init').hidden = false; $('#video-tool').focus(); });
}

/* =========================================================
   API keys
   ========================================================= */
function bindApiKey() {
  const input = $('#api-key'), trInput = $('#tr-key');
  const aiStatus = $('#ai-status'), trStatus = $('#tr-status');
  input.value = getUserKey(); trInput.value = getTrKey();
  const show = (box, msg, ok) => { box.hidden = false; box.classList.toggle('bad', !ok); box.replaceChildren(icon(ok ? 'circle-check' : 'triangle-exclamation'), el('span', { text: msg })); };
  if (API_KEY) show(aiStatus, t('keyCanvas'), true);
  $$('[data-reveal]').forEach(b => b.addEventListener('click', () => {
    const f = $('#' + b.dataset.reveal);
    const vis = f.type === 'password';
    f.type = vis ? 'text' : 'password';
    b.setAttribute('aria-pressed', String(vis));
    b.textContent = t(vis ? 'hide' : 'show');
  }));
  $('#api-key-clear').addEventListener('click', () => {
    input.value = ''; trInput.value = ''; store.set(KEY_STORE, ''); store.set(TR_KEY_STORE, '');
    trStatus.hidden = true; show(aiStatus, t('keyDeleted'), true);
  });
  $('#api-test').addEventListener('click', async () => {
    store.set(KEY_STORE, input.value.trim());
    store.set(TR_KEY_STORE, trInput.value.trim());
    trStatus.hidden = true;
    if (!API_KEY && !input.value.trim()) { show(aiStatus, t('keyFirst'), false); input.focus(); return; }
    show(aiStatus, t('testing'), true);
    try {
      await callGemini({ contents: [{ parts: [{ text: 'Reply with the single word: OK' }] }] }, 1, m => show(aiStatus, t('testingModel', { m }), true));
      show(aiStatus, t('keyOk', { m: lastModelUsed }), true);
    } catch (e) { console.error(e); show(aiStatus, explainError(e), false); }
    const trKey = (trInput.value.trim() || input.value.trim());
    if (trKey) {
      try { await googleTranslate('Hello', 'en', S.lang === 'en' ? 'el' : S.lang, trKey); show(trStatus, t('trOk'), true); }
      catch (e) { console.warn(e); show(trStatus, t('trNo'), false); }
    }
  });
}

/* =========================================================
   Feedback: toasts + screen-reader announcements
   ========================================================= */
function announce(msg) {
  const a = $('#sr-announcer');
  a.textContent = '';
  setTimeout(() => { a.textContent = msg; }, 60);
}
function toast(msg, type = 'info', action) {
  const tEl = el('div', { class: 'toast toast-' + type, role: type === 'error' ? 'alert' : null },
    icon(type === 'error' ? 'triangle-exclamation' : 'circle-info'),
    el('span', { text: msg }),
    action ? el('button', { type: 'button', class: 'toast-action', onclick: () => { action.onClick(); tEl.remove(); } }, action.label) : null,
    el('button', { type: 'button', 'aria-label': t('closeToast'), onclick: () => tEl.remove() }, icon('xmark')));
  $('#toasts').append(tEl);
  if (type !== 'error') { announce(msg); setTimeout(() => tEl.remove(), action ? 10000 : 6000); }
}

/* =========================================================
   Input helpers
   ========================================================= */
let srcTimer;
function updateCount() {
  const words = $('#source-text').value.trim().split(/\s+/).filter(Boolean).length;
  $('#char-count').textContent = t('words', { n: words, m: Math.max(1, Math.round(words / 200)) });
}
function bindInput() {
  $('#source-text').addEventListener('input', () => {
    updateCount();
    clearTimeout(srcTimer);
    srcTimer = setTimeout(() => { renderSource(); populateVoiceSelect(); }, 300);
  });
  $('#format-btn').addEventListener('click', processText);
  $('#sample-btn').addEventListener('click', loadSample);
  $('#print-btn').addEventListener('click', () => window.print());
  $('#clear-btn').addEventListener('click', () => {
    const prev = $('#source-text').value, prevData = lastData;
    if (!prev) return;
    $('#source-text').value = ''; lastData = null;
    updateCount(); renderEmptyAll(); renderSource();
    toast(t('cleared'), 'info', { label: t('undo'), onClick: () => {
      $('#source-text').value = prev; updateCount();
      if (prevData) renderAll(prevData); else renderSource();
    } });
  });
}

/* =========================================================
   Init
   ========================================================= */
bindSettings();
bindApiKey();
bindRuler();
bindTabs();
bindInput();
bindTranslate();
bindTts();
bindChat();
bindVideo();
applyI18n();
</script>
